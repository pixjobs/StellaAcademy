# cloudbuild.web.yaml
timeout: "1200s"

substitutions:
  _REGION: europe-west1
  _AR_REPO: stella
  _SERVICE: stella-web
  _IMAGE_TAG: latest

steps:
  # ----------------------------------------------------------------------------
  # STEP 1: Build the Docker image
  # ----------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_IMAGE_TAG}
      - -f
      - Dockerfile.web
      - .

  # ----------------------------------------------------------------------------
  # STEP 2: Push the image to Artifact Registry
  # ----------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_IMAGE_TAG}

  # ----------------------------------------------------------------------------
  # STEP 3: Deploy to Cloud Run (mount runtime secrets by NAME, not value)
  # ----------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_IMAGE_TAG}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production
      # The weekly "Help test Stella" digest (app/api/volunteer/digest) posts to Jira.
      - --update-secrets=JIRA_API_TOKEN=JIRA_API_TOKEN:latest,VOLUNTEER_DIGEST_KEY=VOLUNTEER_DIGEST_KEY:latest
      - --cpu=1
      - --memory=512Mi
      - --concurrency=40
      # Three instances serve 120 visitors at once, and cap the bill if the site is flooded.
      - --max-instances=3
      - --timeout=60
      - --cpu-boost
      - --execution-environment=gen2
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_IMAGE_TAG}
